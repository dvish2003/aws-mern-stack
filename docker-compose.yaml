version: "3.8"

services:
  backend:
    image: dvish2003/mern-backend:latest
    container_name: backend_service
    expose:
      - "5000"
    environment:
      PORT: 5000
      MONGO_DB_URL: "mongodb+srv://dvish2003:Vishan2003%23%23%23@cluster0.ijybos0.mongodb.net/aws-mern?appName=Cluster0"
    restart: always

  frontend:
    image: dvish2003/mern-frontend:latest
    container_name: frontend_service
    expose:
      - "3000"
    depends_on:
      - backend
    restart: always
